[pytest]
# Used inside the api container:  docker compose exec api pytest
# (From the repo root, `pytest` uses ../pytest.ini and runs every suite.)
testpaths = tests
pythonpath = . ..
addopts = -q --import-mode=importlib
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore:Field name "schema" in "ToolSchema" shadows:UserWarning
    ignore::DeprecationWarning:starlette.*
