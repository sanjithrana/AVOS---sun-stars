[pytest]
# One command runs every Python test in the monorepo:
#     cd apps && pytest
# importlib mode lets test files in different folders share basenames
# (e.g. test_validation.py exists in tool_gateway/ and api/tests/).
addopts = -q --import-mode=importlib
pythonpath = . api
testpaths =
    packages/contracts/tests
    tool_gateway/tests
    agentic_core
    api/tests
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore:Field name "schema" in "ToolSchema" shadows:UserWarning
    ignore::DeprecationWarning:starlette.*
markers =
    db: needs a reachable Postgres (TEST_DATABASE_URL)
    redis: needs a reachable Redis (REDIS_URL)
    temporal: needs a reachable Temporal server (TEMPORAL_HOST)
    live_api: needs the API running at LIVE_API_URL
