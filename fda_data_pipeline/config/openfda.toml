# openFDA bulk download configuration
# The downloader reads FDA's live manifest (https://api.fda.gov/download.json), so new
# endpoints FDA adds are picked up automatically. Endpoint keys look like "drug/label".
#
# Run `python pipeline/openfda_download.py --list` to see every endpoint with its
# current size and record count before downloading.

manifest_url = "https://api.fda.gov/download.json"

# Which profile to use when --profile is not given on the command line.
default_profile = "all"

# Parallel partition downloads.
workers = 4

# Refuse to start (unless --yes) when the selected download is bigger than this.
confirm_above_gb = 20

# After download, also write one gzipped NDJSON file per partition (one record per line),
# which loads straight into BigQuery / DuckDB / Spark / pandas.read_json(lines=True).
convert_to_ndjson = true

# Keep the original .json.zip partitions after conversion (needed for re-runs to skip work).
keep_zips = true

[profiles.all]
# Everything on https://open.fda.gov/data/downloads/
include = ["*"]
exclude = []

[profiles.drug]
# All human-drug datasets plus the shared reference sets.
include = ["drug/*", "other/*", "transparency/*"]
exclude = []

[profiles.drug_no_faers]
# Same as "drug" but skips drug/event (FAERS), which is by far the largest dataset.
include = ["drug/*", "other/*", "transparency/*"]
exclude = ["drug/event"]

[profiles.device]
include = ["device/*"]
exclude = []

[profiles.food_animal_tobacco_cosmetic]
include = ["food/*", "animalandveterinary/*", "tobacco/*", "cosmetic/*"]
exclude = []
